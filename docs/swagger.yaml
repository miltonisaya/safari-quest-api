        $ref: '#/definitions/pagination.Meta'
    type: object
  response.CustomApiResponse:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
      status:
        $ref: '#/definitions/response.Status'
    type: object
  response.Status:
    enum:
    - success
    - fail
    - error
    type: string
    x-enum-varnames:
    - StatusSuccess
    - StatusFail
    - StatusError
  services.AuthorityListResponse:
    properties:
      code:
        type: string
      created_at:
        type: string
      name:
        type: string
      updated_at:
        type: string
      uuid:
        type: string
    type: object
  services.AuthorityResponse:
    properties:
