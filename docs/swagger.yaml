      name:
        type: string
      parentUuid:
        type: string
      route:
        type: string
      sortOrder:
        type: integer
      type:
        type: string
      updated_at:
        type: string
      uuid:
        type: string
    type: object
  services.RoleAuthoritiesInput:
    properties:
      authority_uuids:
        items:
