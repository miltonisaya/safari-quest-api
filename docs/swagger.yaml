definitions:
  pagination.Meta:
    properties:
      last_page:
        type: integer
      page:
        type: integer
      per_page:
        type: integer
      search:
        type: string
      sort_by:
        type: string
      sort_dir:
        type: string
      total:
        type: integer
    type: object
  pagination.Result-services_MenuResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/services.MenuResponse'
        type: array
